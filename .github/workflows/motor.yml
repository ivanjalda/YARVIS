name: Motor

on:
  schedule:
    - cron: "*/10 * * * *"   # escucha Telegram cada 10 minutos
    - cron: "5 7 * * *"      # ideas del día (8:05 en España en invierno)
  workflow_dispatch:
    inputs:
      accion:
        description: "escuchar o ideas"
        default: "escuchar"

concurrency:
  group: motor
  cancel-in-progress: false

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Trabajar
        run: python3 motor.py "$ACCION"
        env:
          ACCION: ${{ github.event.schedule == '5 7 * * *' && 'ideas' || github.event.inputs.accion || 'escuchar' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
