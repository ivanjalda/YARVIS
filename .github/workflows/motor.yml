name: Motor

on:
  schedule:
    - cron: "17 * * * *"     # respaldo: si el motor se apagara, se enciende solo cada hora
  workflow_dispatch:
    inputs:
      accion:
        description: "vigilar o manana"
        default: "vigilar"

concurrency:
  group: motor
  cancel-in-progress: false

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: pip install --quiet cryptography
      - name: Trabajar
        run: python3 motor.py "$ACCION"
        env:
          ACCION: ${{ github.event.inputs.accion || 'vigilar' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PANEL_CLAVE: ${{ secrets.PANEL_CLAVE }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
