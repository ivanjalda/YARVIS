name: App Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/app.yml"

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Icono de la app
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            curl -sfL https://ivanjalda.github.io/mi-panel/icono-192.png -o android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - name: Llave de firma (se guarda en la memoria privada)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          API=https://api.github.com/repos/ivanjalda/motor-memoria/contents/yarvis.jks
          if ! curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" "$API" -o "$RUNNER_TEMP/yarvis.jks"; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/yarvis.jks" -alias yarvis -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass yarvis-community16 -keypass yarvis-community16 \
              -dname "CN=Yarvis, O=Community16 LLC, C=US"
            printf '{"message":"llave de la app","content":"%s"}' "$(base64 -w0 "$RUNNER_TEMP/yarvis.jks")" > "$RUNNER_TEMP/subir.json"
            curl -sf -X PUT -H "Authorization: Bearer $GH_TOKEN" "$API" -d @"$RUNNER_TEMP/subir.json" > /dev/null
          fi
      - name: Fabricar la app
        working-directory: android
        env:
          VERSION: ${{ github.run_number }}
          LLAVE: ${{ runner.temp }}/yarvis.jks
          LLAVE_CLAVE: yarvis-community16
        run: gradle assembleRelease --no-daemon
      - name: Publicar la app en el panel
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/ivanjalda/mi-panel.git /tmp/sitio
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/sitio/yarvis.apk
          cd /tmp/sitio
          git config user.name "Yarvis"
          git config user.email "yarvis@users.noreply.github.com"
          git add yarvis.apk
          git commit -m "App Android de Yarvis" || echo "sin cambios"
          git push
