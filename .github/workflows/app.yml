name: App Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/app.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Icono de la app
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          curl -sfL https://ivanjalda.github.io/mi-panel/icono-192.png -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Fabricar la app
        working-directory: android
        env:
          VERSION: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon
      - name: Publicar la app en el panel
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/ivanjalda/mi-panel.git panel
          cp android/app/build/outputs/apk/debug/app-debug.apk panel/yarvis.apk
          cd panel
          git config user.name "Yarvis"
          git config user.email "yarvis@users.noreply.github.com"
          git add yarvis.apk
          git commit -m "App Android de Yarvis" || echo "sin cambios"
          git push
