plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ivanjalda.yarvis'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ivanjalda.yarvis'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION') ?: '1')
        versionName '1.' + (System.getenv('VERSION') ?: '1')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
